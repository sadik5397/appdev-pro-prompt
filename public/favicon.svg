<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0866FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1E2638" stroke-width="12" />

  <!-- Outer Tech Hex Ring -->
  <path d="M256 64 L416 160 L416 352 L256 448 L96 352 L96 160 Z" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Core Diamond Mark -->
  <path d="M256 128 L368 256 L256 384 L144 256 Z" fill="url(#blueGrad)" filter="url(#glow)" />

  <!-- Inner Sparkle Cutout -->
  <path d="M256 192 L276 256 L256 320 L236 256 Z" fill="#FFFFFF" />

  <!-- Accent Nodes -->
  <circle cx="256" cy="128" r="14" fill="#38BDF8" />
  <circle cx="368" cy="256" r="14" fill="#0866FF" />
  <circle cx="256" cy="384" r="14" fill="#38BDF8" />
  <circle cx="144" cy="256" r="14" fill="#0866FF" />
</svg>